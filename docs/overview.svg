<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="302" viewBox="0 0 1000 302" role="img" aria-labelledby="title description">
  <title id="title">PC Migration Helper W/MCP</title>
  <desc id="description">A Windows folder review from source inventory through saved decisions to a controlled copy queue.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#15243a"/>
      <stop offset="1" stop-color="#0a1526"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0v24" fill="none" stroke="#afcdf9" stroke-opacity=".08"/>
    </pattern>
    <clipPath id="clip"><rect x="1" y="1" width="998" height="300" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="302" fill="url(#panel)"/>
    <rect x="525" width="475" height="302" fill="url(#grid)"/>
    <path d="M557 27v248" stroke="#304763"/>
    <path d="M0 0h1000v3H0" fill="#9bc8f4" opacity=".65"/>
  </g>
  <rect x="1" y="1" width="998" height="300" rx="20" fill="none" stroke="#38506e"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
